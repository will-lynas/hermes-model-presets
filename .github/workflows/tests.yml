name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
      - name: Ruff lint and required annotations
        run: ruff check .
      - name: Ruff formatting
        run: ruff format --check .
      - name: ty type checking
        run: ty check .

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
      - run: python -m pytest -q
