name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.2"
          python-version: "3.11"
          activate-environment: true
          enable-cache: false
      - name: Install pinned development tools
        run: uv pip sync --require-hashes requirements-dev.txt
      - name: Ruff lint and required annotations
        run: ruff check .
      - name: Ruff formatting
        run: ruff format --check .
      - name: ty type checking
        run: ty check .

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.2"
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: false
      - name: Install pinned development tools
        run: uv pip sync --require-hashes requirements-dev.txt
      - run: python -m pytest -q
